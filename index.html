<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPal – Getränke</title>
<style>
  :root { --pp-blue:#003087; --pp-light:#0070ba; }
  * { box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    margin:0; background:#f4f6f9; color:#1a1a1a;
    display:flex; justify-content:center; padding:24px;
  }
  .wrap { width:100%; max-width:480px; }
  h1 { font-size:22px; text-align:center; color:var(--pp-blue); margin:8px 0 4px; }
  p.sub { text-align:center; color:#666; margin:0 0 24px; font-size:14px; }
  a.link {
    display:flex; align-items:center; gap:12px;
    background:#fff; border:1px solid #e2e6ea; border-radius:12px;
    padding:16px 18px; margin-bottom:12px; text-decoration:none;
    color:var(--pp-blue); font-weight:600; font-size:16px;
    transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  a.link:hover { border-color:var(--pp-light); box-shadow:0 3px 10px rgba(0,112,186,.15); }
  .num {
    flex:0 0 32px; height:32px; border-radius:50%;
    background:var(--pp-blue); color:#fff; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .arrow { margin-left:auto; color:var(--pp-light); font-size:20px; }
  footer { text-align:center; color:#999; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PayPal – Getränke</h1>
  <p class="sub">Wähle einen Zahlungslink</p>

  <a class="link" href="https://www.paypal.com/ncp/payment/RTVBRSDT34XG6" target="_blank"><span class="num">1</span>Zahlung 1<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/XXCUEQP3TDP7A" target="_blank"><span class="num">2</span>Zahlung 2<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/AYPL4RAU3SSLL" target="_blank"><span class="num">3</span>Zahlung 3<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/TQ2FQXE5QJDZS" target="_blank"><span class="num">4</span>Zahlung 4<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/UX9B8CBWMGW2C" target="_blank"><span class="num">5</span>Zahlung 5<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/WD4MCH7DGHJU4" target="_blank"><span class="num">6</span>Zahlung 6<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/PP2XPW2CN5MLA" target="_blank"><span class="num">7</span>Zahlung 7<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/DTZCD84HGXXSW" target="_blank"><span class="num">8</span>Zahlung 8<span class="arrow">›</span></a>
  <a class="link" href="https://www.paypal.com/ncp/payment/YPW57B7K8P9YA" target="_blank"><span class="num">9</span>Zahlung 9<span class="arrow">›</span></a>

  <footer>Sicher bezahlen über PayPal</footer>
</div>
</body>
</html>
